apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-oc
  labels:
    app: nodejs-oc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-oc
  template:
    metadata:
      labels:
        app: nodejs-oc
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nodejs-oc
        # Replace the organization before deployment; use a signed immutable tag or digest.
        image: quay.io/REPLACE_WITH_YOUR_ORG/nodejs-oc:1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        ports:
        - containerPort: 3000
          name: http
        # Environment variables
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        # Resource limits (adjust based on your cluster)
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-oc
  labels:
    app: nodejs-oc
spec:
  selector:
    app: nodejs-oc
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nodejs-oc
  labels:
    app: nodejs-oc
spec:
  to:
    kind: Service
    name: nodejs-oc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
